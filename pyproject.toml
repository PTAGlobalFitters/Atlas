[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-pta"
version = "0.1.0"
description = "JAX/NumPyro Bayesian analysis for pulsar timing arrays, with a JUG-sourced timing-model sampler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Minimal runtime dependencies actually imported by the package.
# NOTE: `jug` is not on PyPI — it is the github-hosted timing back end
# (https://github.com/MattTMiles/jug, branch `dev`). Install it separately,
# e.g. `pip install git+https://github.com/MattTMiles/jug.git@dev`.
# `MultiHMCGibbs` is vendored in ATLAS/samplers/canetoadracing.py, so it is
# intentionally NOT a dependency here.
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "numpyro",
    "enterprise-pulsar",
    "joblib",
    # Hard, module-level imports on the main path, previously undeclared:
    "scikit-learn",   # signals/factorized/base.py (TruncatedSVD, PCA)
    "tqdm",           # nMatrix/base.py, signals/factorized/base.py, sim.py
    "tqdm-joblib",    # pulsar.py, sim.py, signals/factorized/base.py
    "pint-pulsar",    # pulsar.py imports pint.logging directly
]

[project.scripts]
atlas-run = "ATLAS.runner.cli:main"

[project.optional-dependencies]
# Config-driven, Ray-parallel runs (ATLAS.runner / atlas-run).
runner = [
    "ray",
    "pyyaml",
]

# Test suite. Deliberately does NOT need jug / libstempo / $TEMPO2: the tests
# build models from serialized fixtures and never import ATLAS.pulsar.
test = [
    "pytest",
]

# Extras used only by the demonstration notebooks / plotting.
notebooks = [
    "corner",
    "matplotlib",
]

# ATLAS/experimental/: the normalising-flow and SMBH-population code that
# Stage 7 of the development plan will promote back. `torch` is used only by
# astro.py for SobolEngine during offline training-set generation and must
# never be reachable at sampling time.
experimental = [
    "dm-haiku",
    "distrax",
    "optax",
    "torch",
]

[tool.setuptools.packages.find]
include = ["ATLAS*"]

[tool.setuptools.package-data]
"ATLAS.runner" = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a few seconds",
    "gpu: needs a GPU",
    "golden: full sampling run checked against a recorded posterior",
    "needs_data: reads par/tim files, so needs PINT or tempo2",
]
